<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout :: head('Lançamento')}"></head>
<body>
<nav th:replace="~{layout :: menu('mes')}"></nav>
<main class="estreito">
    <h1 th:text="${lancamento.id == null} ? 'Novo lançamento' : 'Editar lançamento'">Lançamento</h1>
    <form th:action="@{/lancamentos}" th:object="${lancamento}" method="post" class="form">
        <input type="hidden" th:field="*{id}">
        <label>Tipo
            <select th:field="*{tipo}"><option th:each="t : ${tipos}" th:value="${t}" th:text="${t.rotulo}"></option></select>
        </label>
        <label>Natureza
            <select th:field="*{natureza}"><option th:each="n : ${naturezas}" th:value="${n}" th:text="${n.rotulo}"></option></select>
        </label>
        <label>Descrição
            <input type="text" th:field="*{descricao}" required autofocus>
            <span class="erro" th:errors="*{descricao}"></span>
        </label>
        <label>Valor (R$)
            <input type="number" th:field="*{valor}" step="0.01" min="0">
            <small>Deixe vazio se ainda não souber (ex.: conta de luz).</small>
            <span class="erro" th:errors="*{valor}"></span>
        </label>
        <label>Data
            <input type="date" th:field="*{data}" required>
            <span class="erro" th:errors="*{data}"></span>
        </label>
        <label class="check"><input type="checkbox" th:field="*{efetivado}"> Já pago / recebido</label>
        <label>Observação
            <input type="text" th:field="*{observacao}">
        </label>
        <div class="acoes">
            <button class="btn">Salvar</button>
            <a class="btn sec" th:href="@{/}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
