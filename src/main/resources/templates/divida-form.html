<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout :: head('Dívida')}"></head>
<body>
<nav th:replace="~{layout :: menu('dividas')}"></nav>
<main class="estreito">
    <h1 th:text="${divida.id == null} ? 'Nova dívida' : 'Editar dívida'">Dívida</h1>
    <form th:action="@{/dividas}" th:object="${divida}" method="post" class="form">
        <input type="hidden" th:field="*{id}">
        <label>Descrição
            <input type="text" th:field="*{descricao}" required autofocus>
            <span class="erro" th:errors="*{descricao}"></span>
        </label>
        <label>Credor
            <input type="text" th:field="*{credor}">
        </label>
        <label>Valor original em aberto (R$)
            <input type="number" th:field="*{valorOriginal}" step="0.01" min="0.01" required>
            <span class="erro" th:errors="*{valorOriginal}"></span>
        </label>
        <label>Data de origem
            <input type="date" th:field="*{dataOrigem}">
        </label>
        <label>Observação
            <input type="text" th:field="*{observacao}">
        </label>
        <div class="acoes">
            <button class="btn">Salvar</button>
            <a class="btn sec" th:href="@{/dividas}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
