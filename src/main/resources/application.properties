spring.application.name=controle-financeiro

# Aplicação local, sem autenticação: escuta somente em localhost
server.address=127.0.0.1
server.port=8081

# Banco de dados em arquivo (./data/financeiro.mv.db), persiste entre execuções
spring.datasource.url=jdbc:h2:file:./data/financeiro;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
spring.thymeleaf.cache=false
